plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'checkstyle'
    id 'pmd'
}

android {
    namespace 'com.whisperonnx'
    compileSdk 35

    lint {
        disable 'MissingTranslation'
        error 'HardcodedText', 'SetTextI18n'
        abortOnError true
    }

    defaultConfig {
        applicationId "dev.starkbit.chato"  // External: a different ID from upstream Whisper+, so both can be installed
        minSdk 28
        targetSdk 35
        versionCode 19
        versionName "1.9"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    // External: release signing comes from ~/.gradle/gradle.properties, outside the repo
    signingConfigs {
        release {
            if (project.hasProperty('CHATO_KEYSTORE')) {
                storeFile file(CHATO_KEYSTORE)
                storePassword CHATO_KEYSTORE_PASSWORD
                keyAlias CHATO_KEY_ALIAS
                keyPassword CHATO_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            if (project.hasProperty('CHATO_KEYSTORE')) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters "arm64-v8a"
            }
        }
    }


    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    testOptions {
        // External: android.jar stubs (e.g. Log) throw in JVM tests unless they return defaults
        unitTests.returnDefaultValues = true
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.preference:preference:1.2.1'

    implementation 'com.github.gkonovalov.android-vad:webrtc:2.0.9'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-extensions-android:0.12.4'
    implementation 'com.github.woheller69:FreeDroidWarn:+'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.json:json:20240303'  // External: android.jar's org.json is a stub
    testImplementation 'com.tngtech.archunit:archunit-junit4:1.3.0'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'

}

checkstyle {
    toolVersion = '10.12.5'
    configDirectory = rootProject.file('config/checkstyle')
}
tasks.register('checkstyle', Checkstyle) {
    description = 'Checks package boundaries and project rules in the Java sources'
    source 'src/main/java', 'src/test/java', 'src/androidTest/java', 'src/main/res', 'src/main/AndroidManifest.xml',
            'src/debug/java', 'src/debug/res', 'src/debug/AndroidManifest.xml', rootProject.file('tools'),
            'build.gradle', rootProject.file('build.gradle'), rootProject.file('settings.gradle'),
            rootProject.file('Makefile'), rootProject.file('config/checkstyle'), rootProject.file('.claude/hooks')
    include '**/*.java', '**/*.xml', '**/*.gradle', '**/Makefile', '**/*.sh', '**/*.py'
    classpath = files()
    ignoreFailures = false
    maxWarnings = 0
}

pmd {
    toolVersion = '7.7.0'
}
tasks.register('pmd', Pmd) {
    description = 'Checks the Java sources for branching that is hard to follow'
    ruleSetFiles = rootProject.files('config/pmd/ruleset.xml')
    ruleSets = []
    source 'src/main/java', 'src/debug/java', 'src/test/java', 'src/androidTest/java'
    include '**/*.java'
    exclude '**/thirdparty/**'
    classpath = files()
    consoleOutput = true
    ignoreFailures = false
}
configurations { cpdTool }
dependencies {
    cpdTool 'net.sourceforge.pmd:pmd-java:7.7.0', 'net.sourceforge.pmd:pmd-ant:7.7.0', 'org.slf4j:slf4j-nop:1.7.36'
}
tasks.register('cpd') {
    description = 'Fails on copy-pasted Java code'
    def sources = fileTree('src/main/java') { include '**/*.java'; exclude '**/thirdparty/**' }
    def report = layout.buildDirectory.file('reports/cpd.txt')
    inputs.files(sources)
    outputs.file(report)
    doLast {
        ant.taskdef(name: 'cpdTask', classname: 'net.sourceforge.pmd.ant.CPDTask', classpath: configurations.cpdTool.asPath)
        ant.cpdTask(minimumTokenCount: 70, language: 'java', format: 'text', ignoreAnnotations: true,
                outputFile: report.get().asFile) {
            fileset(dir: 'src/main/java') { include(name: '**/*.java'); exclude(name: '**/thirdparty/**') }
        }
        def found = report.get().asFile.text.trim()
        if (found) {
            throw new GradleException("Copy-pasted code: move the shared part into one method, or into ui/, backend/, recording/ or endpoint/ when two features share it. Do not suppress.\n" + found)
        }
    }
}
