plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'checkstyle'
}

android {
    namespace 'com.whisperonnx'
    compileSdk 35

    lint {
        disable 'MissingTranslation'
        // CLAUDE.md: labels live in strings.xml. Other lint findings stay warnings.
        error 'HardcodedText', 'SetTextI18n'
        abortOnError true
    }

    defaultConfig {
        applicationId "dev.starkbit.chato"  // own ID: installs alongside upstream Whisper+
        minSdk 28
        targetSdk 35
        versionCode 19
        versionName "1.9"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    // Release signing comes from ~/.gradle/gradle.properties (never the repo). Without those
    // properties the release APK is built unsigned, so anyone can still build.
    signingConfigs {
        release {
            if (project.hasProperty('CHATO_KEYSTORE')) {
                storeFile file(CHATO_KEYSTORE)
                storePassword CHATO_KEYSTORE_PASSWORD
                keyAlias CHATO_KEY_ALIAS
                keyPassword CHATO_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            if (project.hasProperty('CHATO_KEYSTORE')) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters "arm64-v8a"
            }
        }
    }

    // Removed externalNativeBuild block

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    testOptions {
        // android.jar stubs (e.g. Log) return defaults instead of throwing in JVM tests
        unitTests.returnDefaultValues = true
    }

    dependenciesInfo {
        // Disable including dependency metadata when building APKs
        includeInApk = false
        // Disable including dependency metadata when building Android App Bundles
        includeInBundle = false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.preference:preference:1.2.1'

    implementation 'com.github.gkonovalov.android-vad:webrtc:2.0.9'

    //OkHttp for OpenAI API
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    //ONNX Runtime
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.0'  //latest.release
    implementation 'com.microsoft.onnxruntime:onnxruntime-extensions-android:0.12.4'   //latest.release
    implementation 'com.github.woheller69:FreeDroidWarn:+'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.json:json:20240303'  // real JSON parser (android.jar's is a stub)
    testImplementation 'com.tngtech.archunit:archunit-junit4:1.3.0'  // ArchitectureTest

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'

}

// Package boundaries and project rules (config/checkstyle). Run by `make check`.
checkstyle {
    toolVersion = '10.12.5'
    configDirectory = rootProject.file('config/checkstyle')
}
tasks.register('checkstyle', Checkstyle) {
    description = 'Checks package boundaries and project rules in the Java sources'
    source 'src/main/java', 'src/test/java'
    include '**/*.java'
    classpath = files()
    ignoreFailures = false
    maxWarnings = 0
}
